# JourneyMesh frontend - static bundle plus a same-origin API proxy.
#
# Serving the interface and the API from one origin means the browser never
# makes a cross-origin request, so no CORS configuration is needed for the
# containerised stack and VITE_API_BASE_URL can stay empty.

# Docker's embedded DNS. Resolving the upstream at request time (rather than at
# start-up) means the API container can restart without taking nginx with it.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Hardening ----------------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    # The inline theme initialiser is allowed by hash, never by 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'sha256-ndWU9zqaKxqDq/L7EatHuuGGwtIaX8oi3GoIFieXToI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # ---- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1m;

    # ---- Container health ---------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- API proxy ----------------------------------------------------------
    location /api/ {
        set $journeymesh_api "http://api:8000";
        proxy_pass $journeymesh_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Planning a journey can take a while when live providers are configured.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
        proxy_buffering off;
    }

    # ---- Hashed assets are immutable ---------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback so /trip/:id and /history survive a refresh -----------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
