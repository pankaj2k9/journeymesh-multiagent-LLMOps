<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17365d" />
    <meta
      name="description"
      content="JourneyMesh - every journey, intelligently connected. A multilingual agentic travel planner."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon-light.svg" color="#17365d" />
    <!--
      Theme initialiser. This runs before the bundle so the first paint is
      already correct - no flash of the wrong theme on a dark-mode machine.
      Keep it identical to THEME_INIT_SCRIPT in src/theme/theme.ts; a test
      asserts they match, and the CSP carries this script's hash.
    -->
    <script>(function(){try{var k='journeymesh_theme';var s=window.localStorage.getItem(k);var t=(s==='light'||s==='dark'||s==='system')?s:'light';var d=t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);var e=document.documentElement;e.classList.toggle('dark',d);e.style.colorScheme=d?'dark':'light';e.dataset.theme=d?'dark':'light';var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#0b1220':'#17365d');}catch(e){}})();</script>
    <title>JourneyMesh</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
