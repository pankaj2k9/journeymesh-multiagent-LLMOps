line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is the documented pattern
  "UP017",  # datetime.UTC is 3.11+; timezone.utc keeps 3.10 compatibility
  "E501",   # long lines are allowed in tests and long prose strings
]
