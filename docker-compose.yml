# =============================================================================
# JourneyMesh - Every journey, intelligently connected.
#
#   docker compose up --build        the production-shaped stack
#   open http://localhost:8000       React and the API on one origin
#
# This mirrors the Render deployment: one container serving the React build and
# the FastAPI application, talking to PostgreSQL over DATABASE_URL. Locally
# that URL points at the `db` service; in production it points at Neon. Nothing
# in the application knows the difference.
#
# For hot reload while developing, add the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   (or: make docker-dev)
#
# Copy .env.example to .env first if you want to supply provider credentials.
# Every one of them may stay empty.
# =============================================================================

name: journeymesh

# Settings shared by the application and the migration job.
x-app-environment: &app-environment
  APP_NAME: JourneyMesh
  APP_ENV: ${APP_ENV:-production}
  DEBUG: ${DEBUG:-false}

  # The only database configuration there is. Swap it for a Neon URL and
  # nothing else changes.
  # Change the POSTGRES_* values below and this URL together, or point it at
  # a Neon connection string to run the stack against the managed database.
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://journeymesh:journeymesh@db:5432/journeymesh}
  DB_REQUIRE_SSL: ${DB_REQUIRE_SSL:-true}

  # Provider credentials - all optional.
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
  OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}

  # MCP transports.
  MCP_SEARCH_TRANSPORT: ${MCP_SEARCH_TRANSPORT:-disabled}
  MCP_SEARCH_URL: ${MCP_SEARCH_URL:-}
  MCP_AVIATION_TRANSPORT: ${MCP_AVIATION_TRANSPORT:-disabled}
  MCP_AVIATION_URL: ${MCP_AVIATION_URL:-}
  MCP_WEATHER_TRANSPORT: ${MCP_WEATHER_TRANSPORT:-disabled}
  MCP_WEATHER_URL: ${MCP_WEATHER_URL:-}

  # LangSmith observability - optional, and never load-bearing.
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-JourneyMesh}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}

  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-65536}

  GUARDRAILS_ENABLED: ${GUARDRAILS_ENABLED:-true}
  PROMPT_INJECTION_CHECK_ENABLED: ${PROMPT_INJECTION_CHECK_ENABLED:-true}
  PII_GUARD_ENABLED: ${PII_GUARD_ENABLED:-true}
  TOOL_GUARD_ENABLED: ${TOOL_GUARD_ENABLED:-true}

  EVALUATION_ENABLED: ${EVALUATION_ENABLED:-true}
  EVALUATION_MODE: ${EVALUATION_MODE:-deterministic}
  EVALUATOR_MODEL: ${EVALUATOR_MODEL:-}

  MAX_REVISION_COUNT: ${MAX_REVISION_COUNT:-3}
  ENABLE_MOCK_DATA: ${ENABLE_MOCK_DATA:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - the local stand-in for Neon
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: journeymesh-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journeymesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journeymesh}
      POSTGRES_DB: ${POSTGRES_DB:-journeymesh}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Data lives on a named volume, never inside a container filesystem.
      - journeymesh-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-journeymesh} -d ${POSTGRES_DB:-journeymesh}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Alembic - runs once and exits. A failure here stops the application from
  # starting against an incompatible schema.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      target: application
    image: journeymesh:latest
    container_name: journeymesh-migrate
    command: ["migrate"]
    environment:
      <<: *app-environment
      # The local database speaks plain TCP inside the compose network.
      DB_REQUIRE_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # JourneyMesh - the React build and the API in one container
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      target: application
      args:
        # Empty: the browser calls /api on the same origin.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: journeymesh:latest
    container_name: journeymesh-app
    environment:
      <<: *app-environment
      DB_REQUIRE_SSL: "false"
      PORT: "8000"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # The migrate service already applied them.
      RUN_MIGRATIONS: "false"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

volumes:
  journeymesh-db-data:
    name: journeymesh-db-data
