# =============================================================================
# JourneyMesh - Every journey, intelligently connected.
#
#   docker compose up --build          the whole local stack
#   open http://localhost:5173         the interface
#   curl localhost:8000/health         the backend
#
# This file is the LOCAL development orchestration only. Production runs on
# Railway, which does not execute a Compose file: each service below becomes
# its own Railway service, and the Compose-specific parts - depends_on
# ordering, the bind mount, the container network - are replaced by Railway's
# own equivalents. See README.md, "Production deployment".
#
#   Browser  ->  frontend (nginx)  ->  backend (FastAPI)  ->  db (PostgreSQL)
#
# Copy .env.example to .env first if you want to supply provider credentials.
# Every one of them may stay empty: the stack runs end to end without any, and
# labels every unconfirmed price as an ESTIMATE.
# =============================================================================

name: journeymesh

# Settings shared by the backend and the migration job.
x-backend-environment: &backend-environment
  APP_NAME: JourneyMesh
  APP_ENV: ${APP_ENV:-production}
  DEBUG: ${DEBUG:-false}

  # The only database configuration there is, and the only thing that differs
  # between here and production. `db` is the Compose service name, resolved on
  # the container network - never localhost, which inside a container means the
  # container itself.
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://journeymesh:journeymesh@db:5432/journeymesh}
  # TLS is pointless inside a private container network and required by most
  # managed providers, so it is off here and on in production.
  DB_REQUIRE_SSL: "false"

  # Provider credentials - all optional.
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
  OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}

  # MCP transports.
  MCP_SEARCH_TRANSPORT: ${MCP_SEARCH_TRANSPORT:-disabled}
  MCP_SEARCH_URL: ${MCP_SEARCH_URL:-}
  MCP_AVIATION_TRANSPORT: ${MCP_AVIATION_TRANSPORT:-disabled}
  MCP_AVIATION_URL: ${MCP_AVIATION_URL:-}
  MCP_WEATHER_TRANSPORT: ${MCP_WEATHER_TRANSPORT:-disabled}
  MCP_WEATHER_URL: ${MCP_WEATHER_URL:-}

  # LangSmith observability - optional, and never load-bearing.
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-JourneyMesh}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}

  # The frontend proxies /api to the backend, so the browser stays on one
  # origin and this matters only if you call the API from somewhere else.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-65536}

  GUARDRAILS_ENABLED: ${GUARDRAILS_ENABLED:-true}
  PROMPT_INJECTION_CHECK_ENABLED: ${PROMPT_INJECTION_CHECK_ENABLED:-true}
  PII_GUARD_ENABLED: ${PII_GUARD_ENABLED:-true}
  TOOL_GUARD_ENABLED: ${TOOL_GUARD_ENABLED:-true}

  EVALUATION_ENABLED: ${EVALUATION_ENABLED:-true}
  EVALUATION_MODE: ${EVALUATION_MODE:-deterministic}
  EVALUATOR_MODEL: ${EVALUATOR_MODEL:-}

  MAX_REVISION_COUNT: ${MAX_REVISION_COUNT:-3}
  ENABLE_MOCK_DATA: ${ENABLE_MOCK_DATA:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - the same engine that runs in production, on your machine
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: journeymesh-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journeymesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journeymesh}
      POSTGRES_DB: ${POSTGRES_DB:-journeymesh}
      # PGDATA points at a subdirectory so PostgreSQL owns an empty directory
      # of its own even when the bind mount root already exists.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Exposed so you can reach it with psql from the host. Nothing in the
      # stack needs this - the backend uses the container network.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A bind mount, not a named volume: the data lives in the repository at
      # ./db/postgres-data, so `docker compose down` leaves it untouched and
      # you can see it. It is git-ignored.
      - ./db/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-journeymesh} -d ${POSTGRES_DB:-journeymesh}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Alembic - runs once and exits.
  #
  # A separate one-shot service rather than a step inside the backend's
  # start-up, so a failed migration stops the stack instead of producing a
  # server running against a schema it does not expect. This is the local
  # equivalent of Railway's pre-deploy command.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      target: runtime
    image: journeymesh-backend:local
    container_name: journeymesh-migrate
    command: ["migrate"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # FastAPI + LangGraph
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: runtime
    image: journeymesh-backend:local
    container_name: journeymesh-backend
    environment:
      <<: *backend-environment
      PORT: "8000"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # The migrate service has already applied them.
      RUN_MIGRATIONS: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # React build served by nginx, which also proxies /api to the backend so the
  # browser only ever talks to one origin.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        # Empty: the browser calls /api on this origin and nginx proxies it.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: journeymesh-frontend:local
    container_name: journeymesh-frontend
    environment:
      JOURNEYMESH_API_UPSTREAM: http://backend:8000
      JOURNEYMESH_RESOLVER: 127.0.0.11
      JOURNEYMESH_CONNECT_SRC: "'self'"
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
