# =============================================================================
# JourneyMesh - Every journey, intelligently connected.
#
#   docker compose up --build        the whole stack
#   open http://localhost:5173       the interface (API proxied at /api)
#   open http://localhost:8000/docs  the API directly
#
# Copy .env.example to .env first if you want to supply provider credentials.
# Every one of them may stay empty: JourneyMesh runs offline and labels each
# unconfirmed price as an ESTIMATE.
# =============================================================================

name: journeymesh

# Settings shared by the API and the migration job.
x-api-environment: &api-environment
  APP_NAME: JourneyMesh
  APP_ENV: ${APP_ENV:-production}
  DEBUG: ${DEBUG:-false}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-journeymesh}:${POSTGRES_PASSWORD:-journeymesh}@db:5432/${POSTGRES_DB:-journeymesh}

  # Provider credentials - all optional.
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
  OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}

  # MCP transports.
  MCP_SEARCH_TRANSPORT: ${MCP_SEARCH_TRANSPORT:-disabled}
  MCP_SEARCH_URL: ${MCP_SEARCH_URL:-}
  MCP_AVIATION_TRANSPORT: ${MCP_AVIATION_TRANSPORT:-disabled}
  MCP_AVIATION_URL: ${MCP_AVIATION_URL:-}
  MCP_WEATHER_TRANSPORT: ${MCP_WEATHER_TRANSPORT:-disabled}
  MCP_WEATHER_URL: ${MCP_WEATHER_URL:-}

  # The interface is served from the same origin through the nginx proxy, so
  # this only matters when the API is called directly from a browser.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-65536}

  GUARDRAILS_ENABLED: ${GUARDRAILS_ENABLED:-true}
  PROMPT_INJECTION_CHECK_ENABLED: ${PROMPT_INJECTION_CHECK_ENABLED:-true}
  PII_GUARD_ENABLED: ${PII_GUARD_ENABLED:-true}
  TOOL_GUARD_ENABLED: ${TOOL_GUARD_ENABLED:-true}

  EVALUATION_ENABLED: ${EVALUATION_ENABLED:-true}
  EVALUATION_MODE: ${EVALUATION_MODE:-deterministic}
  EVALUATOR_MODEL: ${EVALUATOR_MODEL:-}

  MAX_REVISION_COUNT: ${MAX_REVISION_COUNT:-3}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - trips, results, reviews, audit events and LangGraph checkpoints
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: journeymesh-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journeymesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journeymesh}
      POSTGRES_DB: ${POSTGRES_DB:-journeymesh}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - journeymesh-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-journeymesh} -d ${POSTGRES_DB:-journeymesh}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Alembic - runs once, then exits. The API waits for it to succeed.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      target: runtime
    image: journeymesh-api:latest
    container_name: journeymesh-migrate
    command: ["migrate"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # FastAPI + LangGraph
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      target: runtime
    image: journeymesh-api:latest
    container_name: journeymesh-api
    environment:
      <<: *api-environment
      PORT: "8000"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # The migrate service already applied them.
      RUN_MIGRATIONS: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # React interface, built and served by nginx, proxying /api to the API
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      target: runtime
      args:
        # Empty on purpose: the browser talks to /api on the same origin.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: journeymesh-web:latest
    container_name: journeymesh-web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

volumes:
  journeymesh-db-data:
    name: journeymesh-db-data
