# =============================================================================
# Shared reverse proxy for the OVHcloud VPS - /opt/proxy/docker-compose.yml
#
# One Caddy for the whole machine. It owns ports 80 and 443, terminates TLS
# for every domain, and forwards each one to the right application container
# over the shared `proxy` network.
#
# It is a SEPARATE Compose project from every application, on purpose.
# Redeploying, restarting or tearing down an application must not take the
# proxy - and therefore the other applications - down with it. Nothing here
# depends on, or names, any application: routing lives in sites/*.caddy.
#
# Deployed to /opt/proxy on the VPS:
#   docker network create proxy          # once per VPS, never again
#   cd /opt/proxy && docker compose up -d
#
# After adding or editing a file in sites/, validate and reload without
# dropping connections:
#   /opt/proxy/reload.sh
# =============================================================================

name: proxy

services:
  caddy:
    image: caddy:2-alpine
    container_name: shared-caddy
    environment:
      # The ACME account e-mail, read by the Caddyfile's global options. The
      # default is used when /opt/proxy/.env does not set it, so the value can
      # never be empty (an empty `email` is a Caddyfile syntax error).
      ACME_EMAIL: ${ACME_EMAIL:-admin@travelcrewai.com}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Harmless if unused; browsers fall back to TCP.
      - "443:443/udp"
    volumes:
      # The main Caddyfile is a single-file mount. Edit it in place; if a tool
      # replaces the file instead (new inode), run `docker compose up -d
      # --force-recreate` so the container sees the new one.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # A directory mount, so new and edited site files are visible to the
      # running container immediately - a reload is all they need.
      - ./sites:/etc/caddy/sites:ro
      # Certificates and ACME account keys. Losing this volume means fresh
      # certificate requests for every domain on the next start, which Let's
      # Encrypt rate-limits per domain per week.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - proxy
    healthcheck:
      # Caddy's own admin API on loopback. It proves the process is up and its
      # configuration loaded, without depending on any application being up.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Created once on the VPS with `docker network create proxy`, and shared by
  # every application stack. External here too, so `docker compose down` in
  # this directory leaves the network - and the applications on it - alone.
  proxy:
    external: true

volumes:
  caddy-data:
  caddy-config:
