# =============================================================================
# JourneyMesh - dependency updates
#
# Dependabot opens pull requests. It cannot deploy: a release comes only from
# a push to main, and that path runs the full CI gate and then waits on the
# `production` environment. A Dependabot pull request is reviewed and merged
# like any other.
#
# Note that a Dependabot pull request runs with a read-only token and cannot
# read any environment secret, which is the same posture as a fork's PR.
#
# Deliberately modest: weekly, grouped, and capped, because a two-person
# project drowns in daily individual bumps and starts ignoring them.
# =============================================================================
version: 2

updates:
  # ---- GitHub Actions ------------------------------------------------------
  # Actions are pinned to commit SHAs. Dependabot understands that and updates
  # both the SHA and the trailing version comment, which is the main reason
  # pinning stays maintainable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # ---- Python --------------------------------------------------------------
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: "deps"
    groups:
      # Patch and minor together; a major gets its own pull request because it
      # needs a human to read the changelog.
      python-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  # ---- npm -----------------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: "deps"
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  # ---- Docker base images --------------------------------------------------
  # The FROM lines in each Dockerfile: python:3.11-slim, node:22-alpine,
  # nginx:1.27-alpine. Base image CVEs are the most common finding in the
  # Trivy scan, and this is what fixes them.
  - package-ecosystem: docker
    directories:
      - /
      - /backend
      - /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps"
