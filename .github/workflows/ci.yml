# =============================================================================
# JourneyMesh - continuous integration
#
# Runs on every pull request and every push to main. This workflow is the
# quality gate: deployment (deploy.yml) waits for it and only proceeds when
# every required job has succeeded on main. A pull request never deploys.
# =============================================================================

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref, except on main
# where every commit is a potential deployment and is allowed to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: lint, types, tests, production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Check the build produced an entry point
        run: test -f dist/index.html

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Backend: lint, unit tests, guardrail and evaluation suites, migrations
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    env:
      # The suite runs with no credentials at all, which is the point: every
      # provider has an offline path and LangSmith stays off.
      APP_ENV: test
      DATABASE_URL: ""
      GROQ_API_KEY: ""
      TAVILY_API_KEY: ""
      AVIATIONSTACK_API_KEY: ""
      OPENWEATHER_API_KEY: ""
      LANGSMITH_TRACING: "false"
      LANGSMITH_API_KEY: ""
      LOG_LEVEL: ERROR

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests evals

      - name: Import check
        run: python -c "from app.main import app; print('FastAPI application imports cleanly')"

      - name: Unit and integration tests
        run: pytest -q

      - name: Guardrail and security tests
        run: pytest -q tests/test_guardrails_input.py tests/test_guardrails_output.py tests/test_prompt_injection.py tests/test_pii_guard.py tests/test_tool_guard.py tests/test_security.py

      - name: Evaluation tests
        run: pytest -q tests/test_evaluation.py tests/test_offline_eval.py

      - name: Observability tests
        run: pytest -q tests/test_observability.py

      - name: Offline evaluation suite
        run: python -m evals.run_offline_eval

      - name: Validate the Alembic configuration
        env:
          # A syntactically valid URL is enough: --sql renders the migration
          # offline, without connecting to anything.
          DATABASE_URL: postgresql+psycopg://journeymesh:journeymesh@localhost:5432/journeymesh
        run: |
          alembic upgrade head --sql > /tmp/migration.sql
          grep -q "CREATE TABLE trips" /tmp/migration.sql
          echo "Alembic renders the schema correctly"

  # ---------------------------------------------------------------------------
  # Security: dependency and secret scanning
  # Required: the secret scan and the Python audit. Informational: npm audit,
  # which reports transitive advisories that are frequently not actionable.
  # ---------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --- required -----------------------------------------------------------
      - name: No environment file may be committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$'; then
            echo "::error::an environment file is tracked by git"
            exit 1
          fi
          echo "no .env file is tracked"

      - name: No deploy hook or credential may appear in the repository
        run: |
          set +e
          : > /tmp/hits.txt

          # The Render deploy hook lives only in GitHub secrets.
          git grep -nIE 'https://api\.render\.com/deploy/srv-' \
            -- . ':!*.md' ':!.github/workflows/*' >> /tmp/hits.txt

          # Provider key shapes, with enough body to be a real key rather than
          # a prefix mentioned in a test or a guard pattern.
          git grep -nIE '(gsk_[A-Za-z0-9]{20,}|tvly-[A-Za-z0-9]{16,}|sk-[A-Za-z0-9]{20,}|lsv2_pt_[A-Za-z0-9]{20,})' \
            -- . ':!*.md' ':!.github/workflows/*' >> /tmp/hits.txt

          # A connection string carrying a password. The local compose default
          # is deliberately public and is excluded along with the templates.
          # The excluded paths are documentation and local defaults: the compose
          # file, the env templates, the docs and their generator all carry the
          # published local example URL, which is public by design.
          git grep -nIE 'postgres(ql)?(\+[a-z0-9]+)?://[a-zA-Z0-9_]+:[^@/ ]{8,}@' \
            -- . ':!*.md' ':!*.example' ':!docker-compose*.yml' ':!.github/workflows/*' \
            ':!backend/tests/*' ':!scripts/docgen/*' >> /tmp/hits.txt
          set -e
          if [ -s /tmp/hits.txt ]; then
            echo "::error::possible secret committed to the repository"
            cat /tmp/hits.txt
            exit 1
          fi
          echo "no committed secrets found"

      - name: Python dependency audit
        run: |
          pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --strict --ignore-vuln GHSA-4xh5-x5gv-qwph || {
            echo "::error::pip-audit reported a vulnerability in a direct dependency"
            exit 1
          }

      # --- informational ------------------------------------------------------
      - name: npm audit (informational)
        continue-on-error: true
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --package-lock-only
          npm audit --audit-level=high || echo "::warning::npm audit reported advisories - review, but not blocking"

      - name: Dockerfile validation (informational)
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # ---------------------------------------------------------------------------
  # Docker: every image the deployment uses must build and start.
  #
  # Backend and frontend are what Railway deploys, as two separate services.
  # The combined root image is the single-container option and is built too, so
  # it cannot rot. The compose files are validated last: a Compose file that
  # does not parse is a broken local development environment.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend, backend]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # --- backend ------------------------------------------------------------
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          load: true
          tags: journeymesh-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: The backend starts and reports healthy
        run: |
          docker run -d --name jm-backend-ci \
            -e PORT=8000 \
            -e APP_ENV=production \
            -e DATABASE_URL= \
            -e LANGSMITH_TRACING=false \
            -p 8000:8000 journeymesh-backend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json 2>/dev/null; then
              echo "the backend is healthy after ${attempt} attempts"
              cat /tmp/health.json
              break
            fi
            sleep 2
          done
          grep -q '"status":"healthy"' /tmp/health.json || {
            echo "::error::the backend did not become healthy"
            docker logs jm-backend-ci
            exit 1
          }

      - name: The versioned API still answers
        run: |
          curl -fsS http://127.0.0.1:8000/api/v1/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/api/v1/trips | grep -q '"items"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/nope)" = "404"

      - name: The backend image carries no build leftovers
        run: |
          docker run --rm --entrypoint sh journeymesh-backend:ci -c '
            test ! -d .git && test ! -f .env && test -d app &&
            echo "backend image contents are clean"
          '

      # --- frontend -----------------------------------------------------------
      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: false
          load: true
          tags: journeymesh-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: The frontend serves the application and its routes
        run: |
          # No backend upstream here, so point the proxy at something inert and
          # exercise only what this image is responsible for: the static build,
          # the SPA fallback and its own health path.
          docker run -d --name jm-frontend-ci \
            -e JOURNEYMESH_API_UPSTREAM=http://127.0.0.1:9 \
            -e JOURNEYMESH_RESOLVER=127.0.0.11 \
            -p 8080:80 journeymesh-frontend:ci
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q ok || {
            echo "::error::the frontend did not become healthy"
            docker logs jm-frontend-ci
            exit 1
          }
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          for route in /trip/demo-trip-id /history /about /settings; do
            curl -fsS "http://127.0.0.1:8080${route}" | grep -q '<div id="root">' \
              || { echo "::error::${route} did not return the SPA shell"; exit 1; }
            echo "  ${route} returns the SPA shell"
          done

      - name: The frontend carries the theme content security policy
        run: |
          curl -fsSI http://127.0.0.1:8080/ | grep -qi 'content-security-policy' \
            || { echo "::error::the CSP header is missing"; exit 1; }
          echo "the policy header is present"

      # --- combined single-container image ------------------------------------
      - name: Build the combined image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: application
          push: false
          load: true
          tags: journeymesh:ci
          cache-from: type=gha,scope=combined
          cache-to: type=gha,mode=max,scope=combined

      - name: Stop the containers
        if: always()
        run: |
          docker rm -f jm-backend-ci jm-frontend-ci || true

      # --- compose ------------------------------------------------------------
      - name: The compose files are valid
        run: |
          docker compose config --quiet
          echo "docker-compose.yml is valid"
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          echo "the development overlay is valid"

      - name: Compose declares the three expected services
        run: |
          services=$(docker compose config --services | sort | tr '\n' ' ')
          echo "services: ${services}"
          for expected in backend db frontend; do
            echo "${services}" | grep -qw "${expected}" \
              || { echo "::error::compose is missing the ${expected} service"; exit 1; }
          done

  # ---------------------------------------------------------------------------
  # The gate every deployment waits on.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [frontend, backend, security, docker]
    if: always()

    steps:
      - name: Verify every required job passed
        run: |
          echo "frontend: ${{ needs.frontend.result }}"
          echo "backend:  ${{ needs.backend.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "docker:   ${{ needs.docker.result }}"
          if [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.security.result }}" != "success" ] \
            || [ "${{ needs.docker.result }}" != "success" ]; then
            echo "::error::the quality gate failed - JourneyMesh will not be deployed"
            exit 1
          fi
          echo "quality gate passed"
