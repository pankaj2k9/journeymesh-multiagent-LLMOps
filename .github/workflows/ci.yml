# =============================================================================
# JourneyMesh - continuous integration
#
# The quality gate. It runs on every pull request, and again as the first job
# of a production release, which calls this file with `workflow_call` so the
# same checks run on the merge commit without duplicating the build.
#
# This repository is PUBLIC, so this workflow is written on two assumptions:
#
#   1. It executes untrusted code. A fork's pull request runs here. It is
#      therefore triggered by `pull_request`, never `pull_request_target`, so
#      the token is read-only and no environment secret is reachable.
#   2. Its logs are public. Nothing here prints an environment, a resolved
#      Compose configuration built from real values, or any secret. Compose
#      validation uses throwaway placeholders.
#
# It has no access to the production VPS and cannot deploy anything.
#
# Third-party actions are pinned to full commit SHAs. The trailing comment is
# the human-readable release the SHA belongs to; to upgrade, resolve the new
# tag to its commit and replace both.
# =============================================================================

name: CI

on:
  # A pull request, including one from a public fork. `pull_request` runs the
  # contributor's code with a read-only token and NO access to any environment
  # secret, which is exactly what we want. `pull_request_target` would run it
  # with write access to this repository and is deliberately not used anywhere.
  pull_request:
    branches: [main]

  # Called by deploy-production.yml, so a release runs this same gate on the
  # merge commit rather than duplicating the jobs. There is no `push` trigger:
  # every push to main goes through the deploy workflow, which calls this first.
  workflow_call:

  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref, except on main
# where every commit is a potential deployment and is allowed to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only, and inherited by every job below. No job in CI needs more: it
# publishes no package, writes no commit and touches no deployment.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Frontend: lint, types, tests, production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Check the build produced an entry point
        run: test -f dist/index.html

      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Backend: lint, unit tests, guardrail and evaluation suites, migrations
  # ---------------------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    env:
      # The suite runs with no credentials at all, which is the point: every
      # provider has an offline path and LangSmith stays off.
      APP_ENV: test
      DATABASE_URL: ""
      GROQ_API_KEY: ""
      TAVILY_API_KEY: ""
      AVIATIONSTACK_API_KEY: ""
      OPENWEATHER_API_KEY: ""
      LANGSMITH_TRACING: "false"
      LANGSMITH_API_KEY: ""
      LOG_LEVEL: ERROR

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests evals

      - name: Import check
        run: python -c "from app.main import app; print('FastAPI application imports cleanly')"

      - name: Unit and integration tests
        run: pytest -q

      - name: Guardrail and security tests
        run: pytest -q tests/test_guardrails_input.py tests/test_guardrails_output.py tests/test_prompt_injection.py tests/test_pii_guard.py tests/test_tool_guard.py tests/test_security.py

      - name: Evaluation tests
        run: pytest -q tests/test_evaluation.py tests/test_offline_eval.py

      - name: Observability tests
        run: pytest -q tests/test_observability.py

      - name: Offline evaluation suite
        run: python -m evals.run_offline_eval

      - name: Validate the Alembic configuration
        env:
          # A syntactically valid URL is enough: --sql renders the migration
          # offline, without connecting to anything.
          DATABASE_URL: postgresql+psycopg://journeymesh:journeymesh@localhost:5432/journeymesh
        run: |
          alembic upgrade head --sql > /tmp/migration.sql
          grep -q "CREATE TABLE trips" /tmp/migration.sql
          echo "Alembic renders the schema correctly"

  # ---------------------------------------------------------------------------
  # Security: dependency and secret scanning
  # Required: the secret scan and the Python audit. Informational: npm audit,
  # which reports transitive advisories that are frequently not actionable.
  # ---------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --- required -----------------------------------------------------------
      - name: No environment file may be committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$'; then
            echo "::error::an environment file is tracked by git"
            exit 1
          fi
          echo "no .env file is tracked"

      - name: No deploy hook or credential may appear in the repository
        run: |
          set +e
          : > /tmp/hits.txt

          # The Render deploy hook lives only in GitHub secrets.
          git grep -nIE 'https://api\.render\.com/deploy/srv-' \
            -- . ':!*.md' ':!.github/workflows/*' >> /tmp/hits.txt

          # Provider key shapes, with enough body to be a real key rather than
          # a prefix mentioned in a test or a guard pattern.
          git grep -nIE '(gsk_[A-Za-z0-9]{20,}|tvly-[A-Za-z0-9]{16,}|sk-[A-Za-z0-9]{20,}|lsv2_pt_[A-Za-z0-9]{20,})' \
            -- . ':!*.md' ':!.github/workflows/*' >> /tmp/hits.txt

          # A connection string carrying a password. The local compose default
          # is deliberately public and is excluded along with the templates.
          # The excluded paths are documentation and local defaults: the compose
          # file, the env templates, the docs and their generator all carry the
          # published local example URL, which is public by design.
          git grep -nIE 'postgres(ql)?(\+[a-z0-9]+)?://[a-zA-Z0-9_]+:[^@/ ]{8,}@' \
            -- . ':!*.md' ':!*.example' ':!docker-compose*.yml' ':!.github/workflows/*' \
            ':!backend/tests/*' ':!scripts/docgen/*' >> /tmp/hits.txt
          set -e
          if [ -s /tmp/hits.txt ]; then
            echo "::error::possible secret committed to the repository"
            cat /tmp/hits.txt
            exit 1
          fi
          echo "no committed secrets found"

      # The repository is public, so a key that reaches any commit is exposed
      # the moment it is pushed - deleting it in a later commit does not help.
      # This scans the whole history, not just the diff. `--redact` keeps the
      # finding out of these public logs; the file and line are enough to act.
      - name: Secret scan of the full git history (gitleaks)
        env:
          GITLEAKS: docker.io/zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        run: |
          docker run --rm -v "${PWD}:/repo:ro" "${GITLEAKS}" \
            git /repo --redact --no-banner --exit-code 1 \
            || {
              echo "::error::gitleaks found a credential in the git history."
              echo "Rotate the credential FIRST, then clean the history. A public"
              echo "repository means it was exposed the moment it was pushed."
              exit 1
            }
          echo "gitleaks found no credential in the history"

      - name: Python dependency audit
        run: |
          pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --strict --ignore-vuln GHSA-4xh5-x5gv-qwph || {
            echo "::error::pip-audit reported a vulnerability in a direct dependency"
            exit 1
          }

      # --- informational ------------------------------------------------------
      - name: npm audit (informational)
        continue-on-error: true
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --package-lock-only
          npm audit --audit-level=high || echo "::warning::npm audit reported advisories - review, but not blocking"

      # Run from a digest-pinned image rather than a third-party action: one
      # fewer piece of someone else's JavaScript with access to this runner.
      - name: Dockerfile validation (informational)
        continue-on-error: true
        env:
          HADOLINT: docker.io/hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d # v2.15.1
        run: |
          for f in Dockerfile backend/Dockerfile frontend/Dockerfile; do
            echo "--- ${f}"
            docker run --rm -i "${HADOLINT}" hadolint --failure-threshold error - < "$f" \
              || echo "::warning::hadolint reported findings in ${f}"
          done

  # ---------------------------------------------------------------------------
  # Docker: every image the deployment uses must build and start.
  #
  # Backend and frontend are what the VPS runs, as two separate containers.
  # The combined root image is the single-container option and is built too, so
  # it cannot rot. The compose files are validated last: a Compose file that
  # does not parse is a broken local development environment.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    needs: [frontend, backend]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # --- backend ------------------------------------------------------------
      - name: Build the backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          target: runtime
          push: false
          load: true
          tags: journeymesh-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: The backend starts and reports healthy
        run: |
          docker run -d --name jm-backend-ci \
            -e PORT=8000 \
            -e APP_ENV=production \
            -e DATABASE_URL= \
            -e LANGSMITH_TRACING=false \
            -p 8000:8000 journeymesh-backend:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json 2>/dev/null; then
              echo "the backend is healthy after ${attempt} attempts"
              cat /tmp/health.json
              break
            fi
            sleep 2
          done
          grep -q '"status":"healthy"' /tmp/health.json || {
            echo "::error::the backend did not become healthy"
            docker logs jm-backend-ci
            exit 1
          }

      - name: The versioned API still answers
        run: |
          curl -fsS http://127.0.0.1:8000/api/v1/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8000/api/v1/trips | grep -q '"items"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/nope)" = "404"

      - name: The backend image carries no build leftovers
        run: |
          docker run --rm --entrypoint sh journeymesh-backend:ci -c '
            test ! -d .git && test ! -f .env && test -d app &&
            echo "backend image contents are clean"
          '

      # --- frontend -----------------------------------------------------------
      - name: Build the frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          target: runtime
          push: false
          load: true
          tags: journeymesh-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: The frontend serves the application and its routes
        run: |
          # No backend upstream here, so point the proxy at something inert and
          # exercise only what this image is responsible for: the static build,
          # the SPA fallback and its own health path.
          docker run -d --name jm-frontend-ci \
            -e JOURNEYMESH_API_UPSTREAM=http://127.0.0.1:9 \
            -e JOURNEYMESH_RESOLVER=127.0.0.11 \
            -p 8080:80 journeymesh-frontend:ci
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q ok || {
            echo "::error::the frontend did not become healthy"
            docker logs jm-frontend-ci
            exit 1
          }
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          for route in /trip/demo-trip-id /history /about /settings; do
            curl -fsS "http://127.0.0.1:8080${route}" | grep -q '<div id="root">' \
              || { echo "::error::${route} did not return the SPA shell"; exit 1; }
            echo "  ${route} returns the SPA shell"
          done

      - name: The frontend carries the theme content security policy
        run: |
          curl -fsSI http://127.0.0.1:8080/ | grep -qi 'content-security-policy' \
            || { echo "::error::the CSP header is missing"; exit 1; }
          echo "the policy header is present"

      # --- combined single-container image ------------------------------------
      - name: Build the combined image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: application
          push: false
          load: true
          tags: journeymesh:ci
          cache-from: type=gha,scope=combined
          cache-to: type=gha,mode=max,scope=combined

      # --- the images must carry no secret and no vulnerability we can fix ----
      #
      # A public image plus a baked-in key is the worst outcome available here,
      # so this asserts the absence directly rather than trusting .dockerignore.
      - name: The images carry no secret
        run: |
          fail=0
          for image in journeymesh-backend:ci journeymesh-frontend:ci; do
            echo "--- ${image}"

            # No environment file survived the build context.
            if docker run --rm --entrypoint sh "${image}" -c \
                 'ls -a / /app /srv/journeymesh 2>/dev/null | grep -qx ".env"'; then
              echo "::error::${image} contains a .env file"
              fail=1
            fi

            # No credential-shaped value baked into the image configuration.
            # Only the variable NAMES are printed - never a value - because
            # these logs are public.
            #
            # GPG_KEY is allowed: the official python image sets it to the
            # PUBLIC key fingerprint used to verify the CPython tarball. It is
            # a fingerprint, not a credential, and it comes from the base image
            # rather than from anything we wrote.
            names=$(docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "${image}" \
              | cut -d= -f1 \
              | grep -iE 'KEY|TOKEN|SECRET|PASSWORD|CREDENTIAL' \
              | grep -vxE 'GPG_KEY' || true)
            if [ -n "${names}" ]; then
              echo "::error::${image} bakes in credential-shaped variables:"
              echo "${names}"
              fail=1
            fi

            # No private key material anywhere in the filesystem.
            if docker run --rm --entrypoint sh "${image}" -c \
                 'grep -rlq "BEGIN OPENSSH PRIVATE KEY\|BEGIN RSA PRIVATE KEY" / 2>/dev/null'; then
              echo "::error::${image} contains private key material"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "neither image carries a secret"

      # ---- image vulnerability scanning --------------------------------------
      #
      # POLICY, stated explicitly because a scanner nobody trusts gets switched
      # off within a month:
      #
      #   * Only HIGH and CRITICAL are considered. LOW and MEDIUM are noise at
      #     this project's size.
      #   * Only findings with a fix available (`--ignore-unfixed`). A finding
      #     we cannot act on is not a build failure, it is a distraction.
      #   * Reported on every run, and NON-BLOCKING by default. Set the
      #     repository variable TRIVY_BLOCKING to "true" to make it fail the
      #     build once the current backlog is clear.
      #
      # Almost every finding here comes from a base image, which is why
      # .github/dependabot.yml watches the Dockerfiles: a weekly base-image
      # bump is what actually closes them, not an exception list.
      - name: Image vulnerability scan
        id: trivy
        env:
          TRIVY: docker.io/aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 # 0.74.0
          BLOCKING: ${{ vars.TRIVY_BLOCKING == 'true' }}
        run: |
          mkdir -p /tmp/trivy-cache
          worst=0
          {
            echo "### Image vulnerabilities (fixable, HIGH and CRITICAL)"
            echo ""
            echo "| Image | CRITICAL | HIGH |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for image in journeymesh-backend:ci journeymesh-frontend:ci; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp/trivy-cache:/root/.cache/ \
              "${TRIVY}" image \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --no-progress \
                --format json \
                "${image}" > "/tmp/trivy-${image%%:*}.json" 2>/dev/null || true

            crit=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(sum(1 for r in (d.get('Results') or []) for v in (r.get('Vulnerabilities') or []) if v.get('Severity')=='CRITICAL'))" "/tmp/trivy-${image%%:*}.json")
            high=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(sum(1 for r in (d.get('Results') or []) for v in (r.get('Vulnerabilities') or []) if v.get('Severity')=='HIGH'))" "/tmp/trivy-${image%%:*}.json")

            echo "| \`${image}\` | ${crit} | ${high} |" >> "$GITHUB_STEP_SUMMARY"
            echo "${image}: ${crit} critical, ${high} high (fixable)"

            if [ "${crit}" -gt 0 ] || [ "${high}" -gt 0 ]; then
              worst=1
              docker run --rm \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v /tmp/trivy-cache:/root/.cache/ \
                "${TRIVY}" image --scanners vuln --severity HIGH,CRITICAL \
                  --ignore-unfixed --no-progress --format table "${image}" 2>/dev/null || true
            fi
          done

          if [ "${worst}" -eq 0 ]; then
            echo "no fixable HIGH or CRITICAL vulnerability in either image"
            exit 0
          fi

          if [ "${BLOCKING}" = "true" ]; then
            echo "::error::fixable HIGH/CRITICAL vulnerabilities present and TRIVY_BLOCKING is on"
            exit 1
          fi
          echo "::warning::fixable HIGH/CRITICAL vulnerabilities present. Merge the Dependabot base-image bump, then set the TRIVY_BLOCKING repository variable to 'true' to enforce this."

      - name: Stop the containers
        if: always()
        run: |
          docker rm -f jm-backend-ci jm-frontend-ci || true

      # --- compose ------------------------------------------------------------
      - name: The compose files are valid
        run: |
          docker compose config --quiet
          echo "docker-compose.yml is valid"
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          echo "the development overlay is valid"

      - name: Compose declares the three expected services
        run: |
          services=$(docker compose config --services | sort | tr '\n' ' ')
          echo "services: ${services}"
          for expected in backend db frontend; do
            echo "${services}" | grep -qw "${expected}" \
              || { echo "::error::compose is missing the ${expected} service"; exit 1; }
          done

      # The production file is what the VPS runs. A release is the wrong place
      # to discover it does not parse, so it is validated here with throwaway
      # values in place of the ones that exist only on the VPS.
      - name: The production compose file is valid
        env:
          POSTGRES_PASSWORD: validate-only
          BACKEND_IMAGE: ghcr.io/owner/journeymesh-backend:validate
          FRONTEND_IMAGE: ghcr.io/owner/journeymesh-frontend:validate
        run: |
          docker compose -f deploy/docker-compose.prod.yml config --quiet
          echo "deploy/docker-compose.prod.yml is valid"

          services=$(docker compose -f deploy/docker-compose.prod.yml --profile migrate \
            config --services | sort | tr '\n' ' ')
          echo "services: ${services}"
          for expected in backend db frontend migrate; do
            echo "${services}" | grep -qw "${expected}" \
              || { echo "::error::the production stack is missing ${expected}"; exit 1; }
          done
          # Caddy is a separate, VPS-level stack now. It must not come back
          # here: two Compose projects cannot both own port 443.
          if echo "${services}" | grep -qw caddy; then
            echo "::error::caddy belongs to deploy/proxy/, not to the application stack"
            exit 1
          fi

          # Production must pull what CI built, never build on the server.
          if docker compose -f deploy/docker-compose.prod.yml config | grep -q "build:"; then
            echo "::error::the production stack must not build on the VPS"
            exit 1
          fi
          echo "the production stack pulls images and builds nothing"

      # The whole point of the shared proxy is that JourneyMesh owns no host
      # port. One published port here would break the next SaaS on this VPS,
      # and would put PostgreSQL or the API on the internet.
      - name: The production stack publishes no host port
        env:
          POSTGRES_PASSWORD: validate-only
          BACKEND_IMAGE: ghcr.io/owner/journeymesh-backend:validate
          FRONTEND_IMAGE: ghcr.io/owner/journeymesh-frontend:validate
        run: |
          published=$(docker compose -f deploy/docker-compose.prod.yml --profile migrate config \
            | grep -E '^\s+published:' || true)
          if [ -n "${published}" ]; then
            echo "::error::the application stack must publish no host port; found:"
            echo "${published}"
            exit 1
          fi
          echo "no host ports are published by the application stack"

      - name: The shared proxy stack is valid
        env:
          ACME_EMAIL: ops@example.com
          JOURNEYMESH_DOMAIN: journeymesh.example.com
        run: |
          docker compose -f deploy/proxy/docker-compose.yml config --quiet
          echo "deploy/proxy/docker-compose.yml is valid"

          # Exactly one stack may own 80 and 443, and this is it.
          rendered=$(docker compose -f deploy/proxy/docker-compose.yml config)
          for port in 80 443; do
            echo "${rendered}" | grep -q "published: \"${port}\"" \
              || { echo "::error::the shared proxy must publish ${port}"; exit 1; }
          done
          echo "the shared proxy publishes 80 and 443"

          # A Caddyfile that does not parse takes TLS down for every
          # application on the VPS, so it is checked by Caddy itself.
          docker run --rm \
            -e ACME_EMAIL -e JOURNEYMESH_DOMAIN \
            -v "${PWD}/deploy/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "deploy/proxy/Caddyfile is valid"

      - name: The VPS scripts are valid shell
        run: |
          bash -n deploy/bootstrap-vps.sh
          bash -n deploy/deploy.sh
          bash -n deploy/backup.sh
          echo "the VPS scripts parse"

  # ---------------------------------------------------------------------------
  # The gate every deployment waits on.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [frontend, backend, security, docker]
    if: always()

    steps:
      - name: Verify every required job passed
        run: |
          echo "frontend: ${{ needs.frontend.result }}"
          echo "backend:  ${{ needs.backend.result }}"
          echo "security: ${{ needs.security.result }}"
          echo "docker:   ${{ needs.docker.result }}"
          if [ "${{ needs.frontend.result }}" != "success" ] \
            || [ "${{ needs.backend.result }}" != "success" ] \
            || [ "${{ needs.security.result }}" != "success" ] \
            || [ "${{ needs.docker.result }}" != "success" ]; then
            echo "::error::the quality gate failed - JourneyMesh will not be deployed"
            exit 1
          fi
          echo "quality gate passed"
