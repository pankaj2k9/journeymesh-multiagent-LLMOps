# =============================================================================
# JourneyMesh - production deployment to an OVHcloud VPS
#
# Manual by design. Pushing to main runs CI; it does not release anything. A
# person opens Actions, picks this workflow and runs it, which is what makes
# "unverified code reached production" impossible by accident.
#
#   push to main -> CI -> (a human decides) -> this workflow -> GHCR -> the VPS
#
# The workflow never builds on the VPS. It builds both images here, pushes them
# to GHCR tagged with the commit SHA, then opens one SSH session that pulls
# those exact tags, runs the migration to completion and starts the stack. The
# artefact CI verified is the artefact that serves traffic.
#
# It does NOT touch the shared reverse proxy in /opt/proxy. That is a separate
# Compose project owning ports 80 and 443 for every application on this VPS, so
# a JourneyMesh release must never restart it.
#
# Required secrets:
#   VPS_SSH_KEY          the PRIVATE half of the deploy key (ed25519, no
#                        passphrase). Its public half lives in the deploy
#                        user's ~/.ssh/authorized_keys on the VPS.
#   VPS_KNOWN_HOSTS      output of `ssh-keyscan -p <port> <host>`. Pinning the
#                        host key is what stops a redirected DNS record from
#                        collecting the deploy key.
#
# Repository variables (none of them sensitive):
#   VPS_HOST             the VPS IP address or hostname
#   VPS_USER             deploy
#   VPS_PORT             22
#   VPS_APP_DIR          /opt/journeymesh
#   PUBLIC_URL           https://journeymesh.example.com
#
# One-time VPS preparation is deploy/bootstrap-vps.sh. See deploy/OVHCLOUD.md.
# =============================================================================

name: Deploy to OVHcloud VPS

on:
  workflow_dispatch:
    inputs:
      services:
        description: "What to deploy"
        required: true
        default: backend-and-frontend
        type: choice
        options:
          - backend-and-frontend
          - backend-only
          - frontend-only
      confirm:
        description: 'Type "deploy" to confirm a production release'
        required: true
        default: ""
        type: string

# One release at a time, and never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/journeymesh-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/journeymesh-frontend

jobs:
  # ---------------------------------------------------------------------------
  # Gate: everything that can refuse the release before anything is built.
  # ---------------------------------------------------------------------------
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the release
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo '::error::type "deploy" in the confirm field to release to production'
            exit 1
          fi
          echo "release confirmed"

      - name: Production releases come from main only
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::this workflow must be run from main, not ${{ github.ref_name }}"
            exit 1
          fi
          echo "branch: main"

      - name: Check the deployment credentials are configured
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=0
          [ -n "${VPS_SSH_KEY}" ]            || { echo "::error::VPS_SSH_KEY secret is not set"; missing=1; }
          [ -n "${VPS_KNOWN_HOSTS}" ]        || { echo "::error::VPS_KNOWN_HOSTS secret is not set"; missing=1; }
          [ -n "${{ vars.VPS_HOST }}" ]      || { echo "::error::VPS_HOST variable is not set"; missing=1; }
          [ -n "${{ vars.VPS_USER }}" ]      || { echo "::error::VPS_USER variable is not set"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "credentials are configured"

  # ---------------------------------------------------------------------------
  # Build both images and push them to GHCR, tagged with the commit SHA.
  #
  # A matrix, so the two builds run at the same time and a failure names which
  # half broke. The SHA tag is what the VPS pulls; `latest` exists only for a
  # human running docker compose by hand.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.service }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: backend
            context: ./backend
            image: journeymesh-backend
          - service: frontend
            context: ./frontend
            image: journeymesh-frontend
    steps:
      - name: Skip when this half is not being released
        id: scope
        run: |
          case "${{ inputs.services }}" in
            backend-only)  [ "${{ matrix.service }}" = "backend" ]  && r=build || r=skip ;;
            frontend-only) [ "${{ matrix.service }}" = "frontend" ] && r=build || r=skip ;;
            *)             r=build ;;
          esac
          echo "result=$r" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.service }}: $r"

      - name: Check out the repository
        if: steps.scope.outputs.result == 'build'
        uses: actions/checkout@v4

      - name: Set up Buildx
        if: steps.scope.outputs.result == 'build'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.scope.outputs.result == 'build'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.scope.outputs.result == 'build'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: runtime
          push: true
          # Empty for the frontend: the browser calls /api on the same origin,
          # which nginx proxies to the backend. Nothing secret may go in a
          # VITE_* value - it is compiled into a file the browser downloads.
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
          # The GitHub Actions cache, so an unchanged dependency layer is not
          # rebuilt on every release.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # ---------------------------------------------------------------------------
  # Release: one SSH session that pulls, migrates, starts and verifies.
  # ---------------------------------------------------------------------------
  release:
    name: Release to the VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}

    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/journeymesh' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Report what is being released
        run: |
          {
            echo "### JourneyMesh production release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Released by | @${{ github.actor }} |"
            echo "| Scope | ${{ inputs.services }} |"
            echo "| Host | ${{ vars.VPS_HOST }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='commit  %H%nauthor  %an%ndate    %ad%nsubject %s'

      # --- ssh ----------------------------------------------------------------
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CONF
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_USER}
            Port ${VPS_PORT}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 20
          CONF
          chmod 600 ~/.ssh/config
          # Fails loudly here rather than halfway through a release.
          ssh -o BatchMode=yes vps 'echo "ssh ok: $(hostname)"'

      # The Compose file and the operator scripts are part of the repository, so
      # the VPS never drifts from what is committed. Two things are NOT copied:
      # the environment file, which is owned by the VPS and holds the production
      # secrets, and anything under deploy/proxy/, which belongs to the shared
      # reverse proxy and has its own lifecycle.
      - name: Ship the deployment files
        run: |
          scp -P "${VPS_PORT}" \
            deploy/docker-compose.prod.yml \
            deploy/deploy.sh \
            deploy/backup.sh \
            "vps:${APP_DIR}/"
          ssh vps "chmod +x '${APP_DIR}/deploy.sh' '${APP_DIR}/backup.sh'"

      # JourneyMesh declares the shared network `external: true`, so Compose
      # refuses to start if it is missing. Failing here, before anything is
      # pulled, says exactly what is wrong instead of leaving a half-release.
      - name: The shared proxy network exists
        run: |
          ssh vps "bash -euo pipefail -s" <<'EOF'
          if ! docker network inspect proxy >/dev/null 2>&1; then
            echo "::error::the shared 'proxy' network does not exist on the VPS."
            echo "create it once:  docker network create proxy"
            echo "then start the shared proxy:  cd /opt/proxy && docker compose up -d"
            exit 1
          fi
          echo "the proxy network exists"
          docker ps --filter name=shared-caddy --format 'shared proxy: {{.Names}} {{.Status}}'
          EOF

      - name: Pin the image tags for this release
        env:
          SCOPE: ${{ inputs.services }}
        run: |
          # Only the half being released moves. A backend-only release must
          # leave the frontend on the tag it is already serving.
          ssh vps "bash -euo pipefail -s" <<EOF
          cd '${APP_DIR}'
          touch .env.images
          set_tag() {
            local key="\$1" value="\$2"
            if grep -q "^\${key}=" .env.images; then
              sed -i "s|^\${key}=.*|\${key}=\${value}|" .env.images
            else
              echo "\${key}=\${value}" >> .env.images
            fi
          }
          if [ "${SCOPE}" != "frontend-only" ]; then
            set_tag BACKEND_IMAGE '${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}'
          fi
          if [ "${SCOPE}" != "backend-only" ]; then
            set_tag FRONTEND_IMAGE '${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}'
          fi
          echo "--- .env.images ---"
          cat .env.images
          EOF

      # GITHUB_TOKEN is valid only for the life of this job, so the VPS holds
      # no long-lived registry credential. The login is undone at the end.
      - name: Pull the images on the VPS
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh vps "bash -euo pipefail -s" <<EOF
          cd '${APP_DIR}'
          echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.images pull
          EOF

      # A failed migration stops the release here, with the previous containers
      # still serving traffic and untouched.
      - name: Apply database migrations
        if: inputs.services != 'frontend-only'
        run: |
          ssh vps "bash -euo pipefail -s" <<EOF
          cd '${APP_DIR}'
          docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.images \
            run --rm migrate
          EOF

      - name: Start the new containers
        run: |
          ssh vps "bash -euo pipefail -s" <<EOF
          cd '${APP_DIR}'
          docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.images \
            up -d --remove-orphans
          docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.images ps
          EOF

      - name: Wait for the containers to report healthy
        run: |
          ssh vps "bash -euo pipefail -s" <<'EOF'
          cd '${{ vars.VPS_APP_DIR || '/opt/journeymesh' }}'
          for attempt in $(seq 1 40); do
            unhealthy=""
            for name in journeymesh-db journeymesh-backend journeymesh-frontend; do
              state=$(docker inspect -f '{{.State.Health.Status}}' "$name" 2>/dev/null || echo missing)
              [ "$state" = "healthy" ] || unhealthy="$unhealthy $name=$state"
            done
            if [ -z "$unhealthy" ]; then
              echo "all containers are healthy"
              exit 0
            fi
            echo "  waiting:$unhealthy"
            sleep 10
          done
          echo "::error::containers did not report healthy within 7 minutes"
          docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.images logs --tail 80
          exit 1
          EOF

      # From the internet, through Caddy's certificate, the way a browser sees
      # it. The container health check cannot prove TLS, DNS or the proxy route.
      #
      # /api/v1/health, not /health: nginx proxies only /api/, so the container
      # probe path falls through to the SPA and would answer 200 with HTML for
      # any request at all - including one to a broken backend.
      - name: Verify the public endpoint
        if: vars.PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          echo "polling ${PUBLIC_URL}/api/v1/health"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "${PUBLIC_URL}/api/v1/health" > /tmp/health.json 2>/dev/null; then
              if grep -q '"status":"ok"' /tmp/health.json; then
                echo "the public endpoint is healthy"
                cat /tmp/health.json

                # The interface itself, and the SPA fallback a refresh depends on.
                curl -fsS --max-time 10 "${PUBLIC_URL}/" | grep -q '<div id="root">' \
                  || { echo "::error::the interface did not answer through the proxy"; exit 1; }
                echo "the interface is served through the shared proxy"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::the public endpoint did not report healthy within 5 minutes"
          exit 1

      - name: Remove the registry credential and prune old images
        if: always()
        run: |
          ssh vps 'docker logout ghcr.io >/dev/null 2>&1 || true; docker image prune -af --filter "until=168h" || true'

      - name: Summary
        if: always()
        run: |
          {
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Backend | ${{ inputs.services == 'frontend-only' && 'skipped' || job.status }} |"
            echo "| Frontend | ${{ inputs.services == 'backend-only' && 'skipped' || job.status }} |"
            echo "| Image tag | \`${{ github.sha }}\` |"
            echo ""
            echo "Database: untouched. A release pulls images and applies"
            echo "migrations. It never recreates the PostgreSQL volume, and"
            echo "never reseeds data."
          } >> "$GITHUB_STEP_SUMMARY"
