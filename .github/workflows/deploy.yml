# =============================================================================
# JourneyMesh - production deployment to Railway
#
# Manual by design. Pushing to main runs CI; it does not release anything. A
# person opens Actions, picks this workflow and runs it, which is what makes
# "unverified code reached production" impossible by accident.
#
#   push to main  ->  CI  ->  (a human decides)  ->  this workflow  ->  Railway
#
# Required secret:
#   RAILWAY_TOKEN             a Railway project token, scoped to this project
#
# Repository variables (none of them sensitive):
#   RAILWAY_PROJECT_ID        the Railway project id
#   RAILWAY_ENVIRONMENT       production
#   RAILWAY_BACKEND_SERVICE   the backend service name in Railway
#   RAILWAY_FRONTEND_SERVICE  the frontend service name in Railway
#   RAILWAY_BACKEND_URL       https://<backend>.up.railway.app
#   RAILWAY_FRONTEND_URL      https://<frontend>.up.railway.app
# =============================================================================

name: Deploy to Railway

on:
  workflow_dispatch:
    inputs:
      services:
        description: "What to deploy"
        required: true
        default: backend-and-frontend
        type: choice
        options:
          - backend-and-frontend
          - backend-only
          - frontend-only
      confirm:
        description: 'Type "deploy" to confirm a production release'
        required: true
        default: ""
        type: string

# One release at a time, and never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
  BACKEND_SERVICE: ${{ vars.RAILWAY_BACKEND_SERVICE || 'backend' }}
  FRONTEND_SERVICE: ${{ vars.RAILWAY_FRONTEND_SERVICE || 'frontend' }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    environment:
      name: production
      url: ${{ vars.RAILWAY_FRONTEND_URL }}

    steps:
      # --- gates --------------------------------------------------------------
      - name: Confirm the release
        run: |
          if [ "${{ inputs.confirm }}" != "deploy" ]; then
            echo '::error::type "deploy" in the confirm field to release to production'
            exit 1
          fi
          echo "release confirmed"

      - name: Production releases come from main only
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::this workflow must be run from main, not ${{ github.ref_name }}"
            exit 1
          fi
          echo "branch: main"

      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Report what is being released
        run: |
          {
            echo "### JourneyMesh production release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Released by | @${{ github.actor }} |"
            echo "| Scope | ${{ inputs.services }} |"
            echo "| Environment | ${{ env.RAILWAY_ENVIRONMENT }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='commit  %H%nauthor  %an%ndate    %ad%nsubject %s'

      - name: Check the deployment credentials are configured
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ vars.RAILWAY_PROJECT_ID }}" ]; then
            echo "::error::RAILWAY_PROJECT_ID is not set. Add it as a repository variable."
            exit 1
          fi
          echo "credentials are configured"

      - name: Install the Railway CLI
        run: |
          npm install -g @railway/cli
          railway --version

      # --- backend ------------------------------------------------------------
      # Deployed first: the pre-deploy command runs `alembic upgrade head`, so
      # the schema is current before the new frontend can send traffic at it.
      # A failed migration fails the deployment and Railway keeps the previous
      # release serving.
      - name: Deploy the backend
        if: inputs.services != 'frontend-only'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci \
            --project "${{ vars.RAILWAY_PROJECT_ID }}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${BACKEND_SERVICE}"

      - name: Wait for the backend to report healthy
        if: inputs.services != 'frontend-only' && vars.RAILWAY_BACKEND_URL != ''
        env:
          BACKEND_URL: ${{ vars.RAILWAY_BACKEND_URL }}
        run: |
          echo "polling ${BACKEND_URL}/health"
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 10 "${BACKEND_URL}/health" > /tmp/health.json 2>/dev/null; then
              if grep -q '"status":"healthy"' /tmp/health.json; then
                echo "the backend is healthy"
                cat /tmp/health.json
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::the backend did not report healthy within 10 minutes"
          exit 1

      # --- frontend -----------------------------------------------------------
      - name: Deploy the frontend
        if: inputs.services != 'backend-only'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci \
            --project "${{ vars.RAILWAY_PROJECT_ID }}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${FRONTEND_SERVICE}"

      - name: Wait for the frontend to report healthy
        if: inputs.services != 'backend-only' && vars.RAILWAY_FRONTEND_URL != ''
        env:
          FRONTEND_URL: ${{ vars.RAILWAY_FRONTEND_URL }}
        run: |
          echo "polling ${FRONTEND_URL}/healthz"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "${FRONTEND_URL}/healthz" >/dev/null 2>&1; then
              echo "the frontend is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the frontend did not report healthy within 5 minutes"
          exit 1

      # --- result -------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          {
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Backend | ${{ inputs.services == 'frontend-only' && 'skipped' || job.status }} |"
            echo "| Frontend | ${{ inputs.services == 'backend-only' && 'skipped' || job.status }} |"
            echo ""
            echo "Database: untouched. Deploying an application service never"
            echo "recreates or reseeds the Railway PostgreSQL service."
          } >> "$GITHUB_STEP_SUMMARY"
