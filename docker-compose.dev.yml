# =============================================================================
# Development overlay - hot reload on both halves.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   (or: make docker-dev)
#
#   http://localhost:5173   Vite dev server, hot module replacement
#   http://localhost:8000   FastAPI with --reload
#
# It overrides the same three services rather than adding new ones, so the
# service names, the database and the migration job are identical to the
# production-shaped stack. Only the build targets and the mounts change.
#
# Reload is a development convenience and is never used in production: the
# production stack runs the same image with RELOAD unset.
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      APP_ENV: development
      DEBUG: "true"
      RELOAD: "true"
      LOG_FORMAT: text
      SERVE_FRONTEND: "false"
      # The Vite dev server is a different origin, so CORS is real here.
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      # Live code. The image keeps its virtualenv at /opt/venv, outside the
      # mount, so the dependencies are not shadowed by the host directory.
      - ./backend:/srv/journeymesh
    healthcheck:
      # --reload restarts on every save, so a strict health gate would flap.
      disable: true

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # The dev server talks to the backend directly; there is no nginx here.
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    # !override replaces the base list instead of appending to it. Without it
    # the production mapping (host:80) and this one (host:5173) both claim the
    # same host port and the container fails to start.
    ports: !override
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules: they are built for its platform,
      # and the host's are built for yours.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      disable: true
